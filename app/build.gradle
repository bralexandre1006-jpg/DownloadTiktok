plugins {
    id 'com.android.application'
}

def vc = Integer.parseInt((project.findProperty('versionCode') ?: '1').toString())

android {
    namespace 'be.rst.tiksave'
    compileSdk 35

    defaultConfig {
        applicationId 'be.rst.tiksave'
        minSdk 26
        targetSdk 35
        versionCode vc
        versionName "1.${vc}"
    }

    signingConfigs {
        release {
            storeFile rootProject.file('release.jks')
            storePassword System.getenv('KEYSTORE_PASSWORD')
            keyAlias 'rst'
            keyPassword System.getenv('KEYSTORE_PASSWORD')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
